<body>

<h1>百人一首 上の句・下の句マッチング</h1>

<div class="controls">
  <div class="control-group">
    <label for="rangeSelect">出題範囲:</label>
    <select id="rangeSelect">
      <option value="all">全100首</option>
      <option value="random10">ランダム10首</option>
      <option value="random30">ランダム30首</option>
      <option value="random50">ランダム50首</option>
    </select>
  </div>
  <div class="control-group">
    <label><input type="radio" name="mode" id="modeKanji" value="kanji" checked> 漢字あり</label>
    <label><input type="radio" name="mode" id="modeKana" value="kana"> ひらがなのみ</label>
  </div>
</div>

<div class="controls">
  <button id="startBtn">開始</button>
  <button id="shuffleBtn">シャッフル</button>
  <button id="answerBtn" disabled>答えを見る</button>
  <button id="resetBtn">リセット</button>
  <span class="timer" id="timer">00:00</span>
</div>

<div class="status">
  残り <span class="remain" id="remainCount">100</span> 組 / 全<span id="totalCount">100</span>組
</div>

<div class="answer-msg" id="answerMsg"></div>

<div class="clear-msg" id="clearMsg" style="display:none;"></div>

<div class="table-wrap">

  </table>
</div>

];

let kamiList = [];   // {id, text, kana}
let shimoList = [];  // {id, text, kana}
let selectedKamiIdx = null;
let selectedShimoIdx = null;
let started = false;
let timerInterval = null;
let elapsedSec = 0;
let displayMode = 'kanji'; // 'kanji' or 'kana'
let isJudging = false; // 正解/不正解の判定演出中（この間はセル操作を受け付けない）

const tbody = document.getElementById('tbody');
const timerEl = document.getElementById('timer');
const remainEl = document.getElementById('remainCount');
const totalEl = document.getElementById('totalCount');
const clearMsg = document.getElementById('clearMsg');
const answerMsg = document.getElementById('answerMsg');
const startBtn = document.getElementById('startBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const resetBtn = document.getElementById('resetBtn');
const answerBtn = document.getElementById('answerBtn');
const rangeSelect = document.getElementById('rangeSelect');
const modeKanji = document.getElementById('modeKanji');
const modeKana = document.getElementById('modeKana');

// 出題範囲の選択肢を組み立て（全100首 + 1-10, 11-20, ... 91-100）
function buildRangeOptions() {
  for (let start = 1; start <= 91; start += 10) {
    const end = start + 9;
    const opt = document.createElement('option');
    opt.value = start + '-' + end;
    opt.textContent = start + '〜' + end + '番';
    rangeSelect.appendChild(opt);
  }
}
buildRangeOptions();

function getRangeIds() {
  const val = rangeSelect.value;
  if (val === 'all') {
    return POEMS.map(p => p.id);
  }
  if (val.startsWith('random')) {
    const n = parseInt(val.replace('random', ''), 10);
    return pickRandomIds(n);
  }
  const [start, end] = val.split('-').map(Number);
  const ids = [];
  for (let i = start; i <= end; i++) ids.push(i);
  return ids;
}

// 全100首からランダムにn首分のidを重複なく選ぶ
function pickRandomIds(n) {
  const allIds = POEMS.map(p => p.id);
  shuffleArray(allIds);
  return allIds.slice(0, n);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function initLists() {
  const val = rangeSelect.value;
  const isRandomMode = val.startsWith('random');
  const ids = getRangeIds();
  const poemsInRange = POEMS.filter(p => ids.includes(p.id));
  kamiList = poemsInRange.map(p => ({id: p.id, text: p.kami, kana: p.kanaKami}));
  shimoList = poemsInRange.map(p => ({id: p.id, text: p.shimo, kana: p.kanaShimo}));
  if (isRandomMode) {
    // ランダム出題モードでは、選ばれた首の中での上の句の表示順もランダムにする
    shuffleArray(kamiList);
  }
  shuffleArray(shimoList);
  totalEl.textContent = poemsInRange.length;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function cellText(item) {
  return displayMode === 'kana' ? item.kana : item.text;
}

function render() {
  tbody.innerHTML = '';
  const rowCount = Math.max(kamiList.length, shimoList.length);
  for (let i = 0; i < rowCount; i++) {
    const tr = document.createElement('tr');

    const tdNo = document.createElement('td');
    tdNo.className = 'no';
    tdNo.textContent = (i + 1);
    tr.appendChild(tdNo);

    const tdKami = document.createElement('td');
    if (i < kamiList.length) {
      tdKami.textContent = cellText(kamiList[i]);
      tdKami.dataset.idx = i;
      tdKami.dataset.col = 'kami';
      if (!started || isJudging) tdKami.classList.add('disabled-cell');
      if (i === selectedKamiIdx) tdKami.classList.add('selected');
      tdKami.addEventListener('click', onCellClick);
    }
    tr.appendChild(tdKami);

    const tdShimo = document.createElement('td');
    if (i < shimoList.length) {
      tdShimo.textContent = cellText(shimoList[i]);
      tdShimo.dataset.idx = i;
      tdShimo.dataset.col = 'shimo';
      if (!started || isJudging) tdShimo.classList.add('disabled-cell');
      if (i === selectedShimoIdx) tdShimo.classList.add('selected');
      tdShimo.addEventListener('click', onCellClick);
    }
    tr.appendChild(tdShimo);

    tbody.appendChild(tr);
  }
  remainEl.textContent = kamiList.length;
  updateAnswerBtnState();
}

function updateAnswerBtnState() {
  const exactlyOneSelected =
    (selectedKamiIdx !== null && selectedShimoIdx === null) ||
    (selectedKamiIdx === null && selectedShimoIdx !== null);
  answerBtn.disabled = !(started && !isJudging && exactlyOneSelected);
}

function onCellClick(e) {
  if (!started || isJudging) return;
  const col = e.currentTarget.dataset.col;
  const idx = parseInt(e.currentTarget.dataset.idx, 10);

  answerMsg.textContent = '';

  if (col === 'kami') {
    selectedKamiIdx = (selectedKamiIdx === idx) ? null : idx;
  } else {
    selectedShimoIdx = (selectedShimoIdx === idx) ? null : idx;
  }
  render();

  if (selectedKamiIdx !== null && selectedShimoIdx !== null) {
    checkMatch();
  }
}

function checkMatch() {
  // 判定確定時点のインデックスをローカルにコピーしておく。
  // これをしないと、setTimeoutの待機中に次のセルを選択された場合、
  // 「今の」selectedKamiIdx/selectedShimoIdxを参照してしまい、
  // 無関係な行を誤って削除してしまうバグになる。
  const kamiIdx = selectedKamiIdx;
  const shimoIdx = selectedShimoIdx;
  const kamiItem = kamiList[kamiIdx];
  const shimoItem = shimoList[shimoIdx];
  const isMatch = kamiItem.id === shimoItem.id;

  const kamiCell = tbody.querySelector('td[data-col="kami"][data-idx="' + kamiIdx + '"]');
  const shimoCell = tbody.querySelector('td[data-col="shimo"][data-idx="' + shimoIdx + '"]');

  isJudging = true; // 判定演出が終わるまでセル操作を禁止

  if (isMatch) {
    if (kamiCell) kamiCell.classList.add('correct');
    if (shimoCell) shimoCell.classList.add('correct');
    setTimeout(() => {
      kamiList.splice(kamiIdx, 1);
      shimoList.splice(shimoIdx, 1);
      selectedKamiIdx = null;
      selectedShimoIdx = null;
      isJudging = false;
      render();
      if (kamiList.length === 0 && shimoList.length === 0) {
        finish();
      }
    }, 250);
  } else {
    if (kamiCell) kamiCell.classList.add('wrong');
    if (shimoCell) shimoCell.classList.add('wrong');
    setTimeout(() => {
      selectedKamiIdx = null;
      selectedShimoIdx = null;
      isJudging = false;
      render();
    }, 500);
  }
}

function showAnswer() {
  if (!started || isJudging) return;
  if (selectedKamiIdx !== null && selectedShimoIdx === null) {
    const targetId = kamiList[selectedKamiIdx].id;
    const targetIdx = shimoList.findIndex(s => s.id === targetId);
    if (targetIdx === -1) return;
    const cell = tbody.querySelector('td[data-col="shimo"][data-idx="' + targetIdx + '"]');
    if (cell) {
      cell.classList.add('answer-hint');
      answerMsg.textContent = '正解の下の句: ' + cellText(shimoList[targetIdx]);
      setTimeout(() => cell.classList.remove('answer-hint'), 2500);
    }
  } else if (selectedShimoIdx !== null && selectedKamiIdx === null) {
    const targetId = shimoList[selectedShimoIdx].id;
    const targetIdx = kamiList.findIndex(k => k.id === targetId);
    if (targetIdx === -1) return;
    const cell = tbody.querySelector('td[data-col="kami"][data-idx="' + targetIdx + '"]');
    if (cell) {
      cell.classList.add('answer-hint');
      answerMsg.textContent = '正解の上の句: ' + cellText(kamiList[targetIdx]);
      setTimeout(() => cell.classList.remove('answer-hint'), 2500);
    }
  }
}

function startTimer() {
  elapsedSec = 0;
  timerEl.textContent = formatTime(elapsedSec);
  timerInterval = setInterval(() => {
    elapsedSec++;
    timerEl.textContent = formatTime(elapsedSec);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function setLockedControls(locked) {
  // 開始中はシャッフルと出題範囲変更を禁止
  shuffleBtn.disabled = locked;
  rangeSelect.disabled = locked;
}

function finish() {
  stopTimer();
  clearMsg.textContent = '🎉 全問正解！ タイム: ' + formatTime(elapsedSec);
  clearMsg.style.display = 'block';
  started = false;
  startBtn.disabled = false;
  startBtn.textContent = '開始';
  setLockedControls(false);
  updateAnswerBtnState();
}

startBtn.addEventListener('click', () => {
  if (started) return;
  started = true;
  isJudging = false;
  clearMsg.style.display = 'none';
  answerMsg.textContent = '';
  selectedKamiIdx = null;
  selectedShimoIdx = null;
  startTimer();
  setLockedControls(true);
  startBtn.disabled = true;
  render();
});

shuffleBtn.addEventListener('click', () => {
  if (started) return; // 開始中はシャッフル不可（念のための二重ガード）
  answerMsg.textContent = '';
  selectedKamiIdx = null;
  selectedShimoIdx = null;

  if (rangeSelect.value.startsWith('random')) {
    // ランダムN首モードでは、100首の中から改めてN首を選び直す
    initLists();
  } else {
    shuffleArray(kamiList);
    shuffleArray(shimoList);
  }
  render();
});

answerBtn.addEventListener('click', showAnswer);

resetBtn.addEventListener('click', () => {
  stopTimer();
  elapsedSec = 0;
  timerEl.textContent = formatTime(elapsedSec);
  clearMsg.style.display = 'none';
  answerMsg.textContent = '';
  started = false;
  isJudging = false;
  startBtn.disabled = false;
  startBtn.textContent = '開始';
  selectedKamiIdx = null;
  selectedShimoIdx = null;
  setLockedControls(false);
  initLists();
  render();
});

rangeSelect.addEventListener('change', () => {
  if (started) return; // 開始中は変更不可（selectがdisabledなので通常発火しない）
  stopTimer();
  elapsedSec = 0;
  timerEl.textContent = formatTime(elapsedSec);
  clearMsg.style.display = 'none';
  answerMsg.textContent = '';
  selectedKamiIdx = null;
  selectedShimoIdx = null;
  initLists();
  render();
});

modeKanji.addEventListener('change', () => {
  if (modeKanji.checked) {
    displayMode = 'kanji';
    render();
  }
});
modeKana.addEventListener('change', () => {
  if (modeKana.checked) {
    displayMode = 'kana';
    render();
  }
});

// 初期化
initLists();
render();
</script>
